seed: 1
data_dir: ${OMICPRO_DATA_DIR}/Rice210
run_name: quick_test
model_name: omicpro
model_dir: ../../models
result_dir: ../../results
validation_split: 0.1
data:
  genotype: Rice_geno_zhuanzhi.csv
  expression: Rice-Expression_zhaunzhi.csv
  metabolites: Rice_Metabolites_zhuanzhi.csv
  phenotype: Rice-Phenotypes.csv
  folds: CVFs.csv
  fold_column: cv_1
training:
  epochs: 1
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  aux_loss_weights:
    geno: 1.0
    expr: 1.0
    metab: 1.0
  prompt_lr_mult: 0.3
  prompt_warmup_freeze_branch_epochs: 0
  patience: 1
  min_delta: 0.0
  num_workers: 0
model:
  branch_emb_dim: 32
  fusion_hidden_dims: [32]
  dropout: 0.1
  use_batchnorm: true
  fusion_num_heads: 4
  fusion_layers: 2
  prompt_enable: true
  prompt_length: 6
  prompt_depth: 2
  num_missing_types: 8
  prompt_gate_init: 0.0
  prompt_gate_learnable: true
  mamba_layers: 2
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2

missing:
  enable: false
  ratio:
    train: 0.7
    valid: 0.7
    test: 0.7
  type:
    train: mixed
    valid: mixed
    test: mixed
  pattern_probs:
    geno: 1.0
    expr: 1.0
    metab: 1.0
  table_root: missing_tables
  simulate_missing: false
  simulate_pool: [0, 1, 2, 4]
  fill_strategy: zero
  fill_value: 0.0

preprocess:
  topk_genotype: 256
  topk_expression: 512
  topk_metabolites: 128
