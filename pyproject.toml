[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omicmap"
version = "0.2.0"
description = "Missing-aware prompt-guided multi-omics phenotype prediction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
  "torch",
  "mamba-ssm",
]

[project.scripts]
omicmap-train = "omicmap.train_cv:main"
omicmap-train-fixed = "omicmap.train_fixed_split:main"
omicmap-predict = "omicmap.predict:main"

[tool.setuptools.packages.find]
include = ["omicmap*"]
